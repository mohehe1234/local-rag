[project]
name = "localllm"
version = "1.0.0"
dependencies = [
    "faiss-cpu>=1.11.0.post1",
    "langchain-community>=0.3.27",
    "langchain-huggingface>=0.3.1",
    "langchain-ollama>=0.3.6",
    "langchain-openai>=0.3.28",
    "sentence-transformers>=5.0.0",
    "transformers>=4.45.0, <4.54.0",
]
requires-python = ">=3.13"
authors = [
  {name = "Hisashi Johno"},
  {name = "Atsushi Komaba"},
  {name = "Akitomo Amakawa"}
]
description = "Run local LLMs assisting pancreatic cancer diagnosis."
readme = "README.md"
license = "MIT"
license-files = ["LISENCE"]

[project.optional-dependencies]
cpu = [
  "torch>=2.7.1"
]
cu126 = [
  "torch>=2.7.1"
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu126" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true